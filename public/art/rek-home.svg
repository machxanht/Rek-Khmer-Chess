<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Stylized Angkor heritage landscape">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12291f"/>
      <stop offset="0.52" stop-color="#0b1a14"/>
      <stop offset="1" stop-color="#050a08"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6dc9b" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#e4b860" stop-opacity=".72"/>
      <stop offset="1" stop-color="#d29b3e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6a3c"/>
      <stop offset=".42" stop-color="#4d4e38"/>
      <stop offset="1" stop-color="#23362b"/>
    </linearGradient>
    <linearGradient id="stone2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ad8450"/>
      <stop offset=".45" stop-color="#66705a"/>
      <stop offset="1" stop-color="#24372c"/>
    </linearGradient>
    <pattern id="krama" width="42" height="42" patternUnits="userSpaceOnUse">
