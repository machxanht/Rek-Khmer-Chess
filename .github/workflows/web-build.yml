name: Rek Web Product Gate

on:
  push:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'lib/rek-engine/**'
      - 'index.html'
      - 'package.json'
      - 'tsconfig.web.json'
      - '.github/workflows/web-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'lib/rek-engine/**'
      - 'index.html'
      - 'package.json'
      - 'tsconfig.web.json'
      - '.github/workflows/web-build.yml'

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Build web
        run: npm run build:web
