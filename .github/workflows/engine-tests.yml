name: Rek Core Engine Tests

on:
  push:
    paths:
      - 'lib/rek-engine/**'
      - 'scripts/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'HUONG_DAN_LUAT_CO_REK_KHMER.md'
      - 'SPEC_ENGINE_CO_REK_KHMER.md'
      - 'ENGINE_ARCHITECTURE_REK_KHMER.md'
      - 'RESEARCH_LUAT_REK_KHMER_2026.md'
      - 'RESEARCH_HAO_REK_2026.md'
      - 'PLAN_PHAT_TRIEN_CO_REK.md'
      - 'README.md'
      - '.github/workflows/engine-tests.yml'
  pull_request:
    paths:
      - 'lib/rek-engine/**'
      - 'scripts/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'HUONG_DAN_LUAT_CO_REK_KHMER.md'
      - 'SPEC_ENGINE_CO_REK_KHMER.md'
      - 'ENGINE_ARCHITECTURE_REK_KHMER.md'
      - 'RESEARCH_LUAT_REK_KHMER_2026.md'
      - 'RESEARCH_HAO_REK_2026.md'
      - 'PLAN_PHAT_TRIEN_CO_REK.md'
      - 'README.md'
      - '.github/workflows/engine-tests.yml'

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install engine test dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Typecheck engine
        run: npm run typecheck

      - name: Run core engine regressions
        run: npm run test:engine
