name: Rek Core Engine Tests

on:
  push:
    paths:
      - 'lib/rek-engine/**'
      - 'scripts/run-engine-tests.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/engine-tests.yml'
  pull_request:
    paths:
      - 'lib/rek-engine/**'
      - 'scripts/run-engine-tests.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/engine-tests.yml'

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      # The repository lockfile already drifts from package.json on main
      # (for example canvas-confetti is declared but absent from the importer).
      # Do not let unrelated dependency housekeeping block pure engine tests.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run core engine regressions
        run: pnpm test:engine
