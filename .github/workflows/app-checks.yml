name: Rek Application Checks

on:
  push:
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'scripts/browser-smoke.mjs'
      - 'public/rek-assets/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/app-checks.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'scripts/browser-smoke.mjs'
      - 'public/rek-assets/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/app-checks.yml'

jobs:
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      # main currently has package/lock drift, so do not make UI validation
      # depend on unrelated lockfile housekeeping.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check application
        run: pnpm exec tsc --noEmit --pretty false

      - name: Build production application
        run: pnpm build

      - name: Start production application
        run: |
          pnpm start > /tmp/rek-next.log 2>&1 &
          echo $! > /tmp/rek-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rek-next.log
          exit 1

      - name: Browser smoke test offline routes
        run: node scripts/browser-smoke.mjs

      - name: Print application log on failure
        if: failure()
        run: cat /tmp/rek-next.log || true
