name: Rek Online Product Gate

on:
  push:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'src/online.ts'
      - 'lib/rek-engine/**'
      - 'scripts/run-online-smoke.ts'
      - 'package.json'
      - 'tsconfig.server.json'
      - '.github/workflows/online-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'shared/**'
      - 'src/online.ts'
      - 'lib/rek-engine/**'
      - 'scripts/run-online-smoke.ts'
      - 'package.json'
      - 'tsconfig.server.json'
      - '.github/workflows/online-tests.yml'

jobs:
  online-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Typecheck server
        run: npm run typecheck:server

      - name: Online smoke
        run: npm run test:online
